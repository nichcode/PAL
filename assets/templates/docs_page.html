<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title class="page-title">{{ title }} | PAL</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="docs.css">
</head>

<body>
    <!-- main navigation bar -->
    <header class="page-nav-bar">
        <div class="page-nav-logo">
            <a href="./index.html">
                <img src="logo.svg" alt="" class="pal-logo-img">
            </a>
            <h1 class="page-nav-bar-title">Prime Abstraction Layer</h1>
        </div>
        <nav class="nav-bar-links">
            <a href="./download.html">Download</a>
            <a href="index.html">Documentation</a>
            <a href="https://github.com/nichcode/PAL">GitHub</a>

            <!-- this button holds our empty container for raw SVG data -->
            <button id="nav-bar-theme-toggle"></button>
        </nav>
    </header>

    <nav class="sidebar" aria-label="Documentation">
        <div class="sidebar-entry">
            <a href="index.html">Introduction</a>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-heading">
                <button class="sidebar-arrow" aria-label="Toggle Guides" aria-expanded="false"></button>
                <a href="guides.html">Guides</a>
            </div>

            <ul class="sidebar-tree" hidden>
                {{ guides }}
            </ul>
        </div>

        <div class="sidebar-group">
            <div class="sidebar-heading">
                <button class="sidebar-arrow" aria-label="Toggle API Reference" aria-expanded="false"></button>
                <a href="api_reference.html">API Reference</a>
            </div>

            <ul class="sidebar-tree" hidden>
                {{ modules }}
            </ul>
        </div>
    </nav>

    <div class="page-content-title" page-type="{{ title_page_type }}"><h1>{{ page_content_title }}</h1></div>
    <div class="page-content" page-type="{{ page_type }}">{{ content }}</div>
    <div class="toc" page-type="{{ toc_page_type }}">{{ toc }}</div>

    <script type="text/javascript" src="script.js"></script>
    <script type="text/javascript" src="sidebar.js"></script>
</body>

</html>
