
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | PAL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="docs.css">
    <script type="text/javascript" src="script.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="navbar-logo">
            <a href="../index.html">
                <img src="logo.svg" class="logo-img" alt="PAL Logo">
            </a>
            <h1>Prime Abstraction Layer</h1>
        </div>
        <nav class="navbar-links">
            <a href="../download.html">Download</a>
            <a href="index.html">Documentation</a>
            <a href="https://github.com/nichcode/PAL">GitHub</a>

            <button id="theme-toggle" aria-label="Toggle Theme"></button>
        </nav>
    </header>

    {% include 'sidebar.html' %}

    <div class="content-container" page-type="{{ page_type }}">
    <h1 class="content-title">{{ content_title }}</h1>
    <div class="content">{{ content }}</div>
    <div class="toc">{{ toc }}</div>
    </div>

    <script type="text/javascript" src="sidebar.js"></script>
</body>
</html>
