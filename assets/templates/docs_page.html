<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} | PAL</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="docs.css">
    <link rel="stylesheet" href="responsive.css">

    <script type="text/javascript" src="script.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="navbar-logo">
            <a href="../index.html">
                <img src="logo.svg" class="logo-img" alt="PAL Logo">
            </a>
            <span class="navbar-title">Prime Abstraction Layer</span>
        </div>
        <nav class="navbar-links">
            <a href="../download.html">Download</a>

    <h1 class="page-content-title">{{ content_title }}</h1>
    <div class="page-content">{{ content }}</div>

    <footer class="copyright">
        <p>&copy; 2026 Prime Abstraction Layer. Released under zlib/libpng.</p>
    </footer>

    <script type="text/javascript" src="sidebar.js"></script>
    <script type="text/javascript" src="search-index.js"></script>
    <script type="text/javascript" src="search.js"></script>
