
<div class="module">
    <code>#include &lt;{{ module.file }}&gt;</code>
    <p class="desc">{{ desc }}</p>

    <div class="section-heading">Functions</div>
    {%- for func in functions %}
    <div class="section-entry">
        <div class="entry-signature">
            <pre><span class="type-keyword">{{ func.return_type }}</span> <a href="{{ func.id }}.html">{{ func.name }}</a> ({{ func.args }})</pre>
        </div>
        <div class="entry-brief">
            {{ func.brief }}
        </div>
    </div>
    {%- endfor %}
</div>
