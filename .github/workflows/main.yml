
name: Main
on:
  pull_request:
  push:
    #TODO: remove comment branches: [ master ]

jobs:
  main:
    name: main
    strategy:
      matrix:
        include:
            # GNU Make
          - os: ununtu-latest
            generate_cmd: gmake

            # GNU Make (Clang)
          - os: ubuntu-latest
            generate_cmd: gmake --compiler=clang

            # Visual Studio 2022 (MSVC)
          - os: windows-2022
            generate_cmd: vs2022
            build_cmd: ""

            # Visual Studio 2022 (Clang)
          - os: windows-2022
            generate_cmd: vs2022 --compiler=clang
            build_cmd: /p:PlatformToolset=ClangCl

            # Visual Studio 2026 (MSVC)
          - os: windows-2026
            generate_cmd: vs2026
            build_cmd: ""

            # Visual Studio 2026 (Clang)
          - os: windows-2026
            generate_cmd: vs2026 --compiler=clang
            build_cmd: /p:PlatformToolset=ClangCl

    runs-on: ${{ matrix.os }}

    steps:
      - name: Configuration
        run: |
          echo "OS: ${{ runner.os }}"
          echo "Command: ${{ matrix.generate_cmd }}"