
# TODO: Find a way to make this a script and break tests into seperate executables
name: Main
on:
  workflow_dispatch:
  pull_request:
  push:
    #branches: [ master ]

jobs:
  main-linux:
    name: main-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev

      - name: Generate
        run: ./premake/premake5 gmake

      - name: Build
        run: make -j config=release

      - name: Verify ABI
        run: ./bin/Release/abi-dump --quick

      - name: Run
        run: ./bin/Release/tests

  main-windows:
    name: main-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: microsoft/setup-msbuild@v3

      - name: Download Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -L -o vulkan-sdk.exe https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkan_sdk.exe

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          .\vulkan-sdk.exe --accept-licenses --default-answer --confirm-command install

      - name: Setup Vulkan Environment
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.357.0" >> $env:GITHUB_ENV

      - name: Generate
        shell: cmd
        run: premake\premake5.exe vs2022

      - name: Build
        shell: cmd
        run: msbuild PALWorkspace.sln /m /p:Configuration=Release

      - name: Verify ABI
        shell: cmd
        run: bin\Release\abi-dump.exe --quick

      - name: Run
        shell: cmd
        run: bin\Release\tests.exe