
name: Clang Tools Check
on:
  pull_request:
  push:
    # TODO: branches: [ master ]

jobs:
  clang-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Clang Tools
        run: |
          sudo apt-get update
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-format-22 clang-tidy-22

      - name: Make source files writable
        run: chmod -R u+w .

      - name: Clang Tidy
        run: run-clang-tidy-22 -p .

      - name: Clang Format
        run: |
          files=$(git ls-files '*.c' '*.cpp' '*.h' '*.hpp')
          if [ -n "$files" ]; then
            clang-format-22 --dry-run --Werror $files
          fi
